name: Frontend CI/CD Dev

on:
  workflow_dispatch:

env:
  DOCKER_IMAGE: watchbox-fe:latest

jobs:
  build-and-deploy:
    runs-on: [self-hosted, dev]

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SERVER_URL=https://dev-api.watch-box.net \
            --cache-from ${{ env.DOCKER_IMAGE }} \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -f Dockerfile \
            -t ${{ env.DOCKER_IMAGE }} .

      - name: Deploy with Docker Compose
        working-directory: /home/ubuntu/app
        run: |
          docker compose up -d --no-deps watchbox-fe
          docker image prune -f